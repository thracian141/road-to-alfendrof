# Main pushes publish v<Cargo.toml version> after all platform builds succeed.
# Manual runs on other refs only build artifacts. See RELEASING.md before deploying a new version.
name: Stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so separate main builds cannot upload to the same version concurrently.
concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check stable version
        run: python3 tools/release_version.py

  linux:
    needs: version
    uses: ./.github/workflows/linux.yml

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  mac:
    needs: version
    uses: ./.github/workflows/mac.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Recheck after the builds in case another publisher claimed this version in the meantime.
      - name: Check release tag
        id: version
        run: python3 tools/release_version.py >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: RoadToAlfendrof-*
          merge-multiple: true
          path: dist

      - name: Publish stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Road to Alfendrof ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/RoadToAlfendrof-${{ steps.version.outputs.version }}-x86_64.AppImage
            dist/road-to-alfendrof_${{ steps.version.outputs.version }}_amd64.deb
            dist/road-to-alfendrof-${{ steps.version.outputs.version }}-1.x86_64.rpm
            dist/RoadToAlfendrof-Setup.exe
            dist/RoadToAlfendrof-Mac.zip
            dist/RoadToAlfendrof-Mac.dmg
            dist/RoadToAlfendrof-Linux-x86_64.tar.gz
