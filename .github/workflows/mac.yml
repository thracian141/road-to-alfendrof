# Builds an Apple Silicon app as an updater ZIP and drag-to-install DMG; no Intel release.
# Run manually for artifacts, or let release.yml collect them for a stable release on main.
name: Mac build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Tests and the app use the same release profile and ARM64 target to reuse dependencies.
      - name: Test (release profile)
        run: |
          cargo test --locked --release --lib --target aarch64-apple-darwin
          rustc --edition=2021 --test src/update_install.rs -o "$RUNNER_TEMP/update-tests"
          "$RUNNER_TEMP/update-tests"

      - name: Build (Apple Silicon)
        run: cargo build --locked --release --bin t2f --target aarch64-apple-darwin

      - name: Package Apple Silicon app, update ZIP and installer DMG
        run: |
          VERSION=$(ruby -e 'puts File.read("Cargo.toml")[/^version\s*=\s*"([^"]+)"/, 1]')
          bash installer/mac/package.sh \
            --binary target/aarch64-apple-darwin/release/t2f \
            --output dist --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: RoadToAlfendrof-Mac
          if-no-files-found: error
          path: |
            dist/RoadToAlfendrof-Mac.zip
            dist/RoadToAlfendrof-Mac.dmg
