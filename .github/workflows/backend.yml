name: Multiplayer backend
on:
  pull_request:
    paths: ['backend/**', 'src/net/**', 'src/social.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/backend.yml']
  push:
    paths: ['backend/**', 'src/net/**', 'src/social.rs', 'Cargo.toml', 'Cargo.lock', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

  native-p2p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev
      - run: npm ci
        working-directory: backend
      - name: Test native discovery and direct UDP match
        run: npm run test:native
        working-directory: backend
        env:
          WRANGLER_SEND_METRICS: 'false'
